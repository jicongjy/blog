name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 글을 새로 발행하거나 고쳤을 때 공유용 페이지(글별 OG)를 갱신하기 위해 20분마다 확인한다.
  # 글 목록이 배포본과 같으면 아래 단계를 모두 건너뛴다.
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 한 줄로만 진행하고, 진행 중인 배포는 끊지 않는다. (정기 확인이 푸시 배포를 끊거나, 늦게 끝난 옛 배포가 새 배포를 덮어쓰는 일을 막는다.)
# 대기 중인 실행은 가장 최근 것만 남고, 정기 실행도 항상 최신 main 을 받아 코드와 글 목록을 함께 비교한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 푸시와 수동 실행은 항상 배포한다. 정기 실행은 글 목록이 바뀌었거나 배포된 코드가 최신 커밋과 다를 때만 배포한다.
      - id: check
        if: github.event_name == 'schedule'
        run: node scripts/generate-share.mjs --check
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=${{ steps.check.outputs.changed }}" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.changed == 'true'
        run: npm ci
      # 한국 공휴일 목록을 받아 저장한다. 실패해도 배포를 막지 않고 저장소에 있는 기존 파일을 쓴다.
      - if: steps.gate.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/fetch-holidays.mjs public/holidays.json
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
      - if: steps.gate.outputs.changed == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      - if: steps.gate.outputs.changed == 'true'
        run: node scripts/generate-share.mjs --out dist
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
      - if: steps.gate.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
